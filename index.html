            sentence: "The dogs ___ loudly when someone comes.",
            answer: "bark",
            choices: ["bark", "barks", "does", "has"],
            explanation: "Dogs is plural, so use the base verb 'bark'."
        }

    ]
};


/* =========================================================
   APP VARIABLES
========================================================= */

let currentLevel = "beginner";
let currentSet = 1;
let currentQuestions = [];
let setScores = [];
let totalScore = 0;
let totalQuestionsAnswered = 0;
let answersChecked = false;


/* =========================================================
   LEVEL DESCRIPTION
========================================================= */

function updateLevelDescription() {

    const description = document.getElementById("levelDescription");

    if (currentLevel === "beginner") {
        description.textContent = "2–3 answer choices";
    }

    else if (currentLevel === "medium") {
        description.textContent = "3–4 answer choices";
    }

    else {
        description.textContent = "4 mixed answer choices";
    }
}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    const newArray = [...array];

    for (let i = newArray.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [newArray[i], newArray[j]] =
        [newArray[j], newArray[i]];
    }

    return newArray;
}


/* =========================================================
   START A SET
========================================================= */

function startSet() {

    answersChecked = false;

    const bank = questionBank[currentLevel];

    currentQuestions = shuffle(bank).slice(0, 10);

    document.getElementById("progress").textContent =
        "Set " + currentSet + " of 3";

    document.getElementById("checkButton").style.display =
        "inline-block";

    document.getElementById("nextButton").style.display =
        "none";

    renderQuestions();

    updateResults();
}


/* =========================================================
   RENDER QUESTIONS
========================================================= */

function renderQuestions() {

    const container =
        document.getElementById("questionContainer");

    container.innerHTML = "";

    currentQuestions.forEach((question, index) => {

        const card = document.createElement("div");

        card.className = "question-card";

        const number = document.createElement("div");

        number.className = "question-number";

        number.textContent =
            "Question " + (index + 1);

        const sentence = document.createElement("div");

        sentence.className = "sentence";

        sentence.textContent =
            question.sentence;

        const select = document.createElement("select");

        select.className = "answer-select";

        select.id = "answer-" + index;

        const defaultOption =
            document.createElement("option");

        defaultOption.value = "";

        defaultOption.textContent =
            "Choose an answer...";

        select.appendChild(defaultOption);

        /*
           Shuffle the choices so the correct answer
           is not always in the same position.
        */

        const choices =
            shuffle(question.choices);

        choices.forEach(choice => {

            const option =
                document.createElement("option");

            option.value = choice;

            option.textContent = choice;

            select.appendChild(option);
        });

        const feedback =
            document.createElement("div");

        feedback.className = "feedback";

        feedback.id = "feedback-" + index;

        card.appendChild(number);

        card.appendChild(sentence);

        card.appendChild(select);

        card.appendChild(feedback);

        container.appendChild(card);
    });
}


/* =========================================================
   CHECK ANSWERS
========================================================= */

function checkAnswers() {

    if (answersChecked) {
        return;
    }

    let score = 0;

    currentQuestions.forEach((question, index) => {

        const select =
            document.getElementById("answer-" + index);

        const feedback =
            document.getElementById("feedback-" + index);

        const selected =
            select.value;

        if (selected === question.answer) {

            score++;

            feedback.className =
                "feedback correct";

            feedback.innerHTML =
                "✓ Correct! " +
                question.explanation;
        }

        else {

            feedback.className =
                "feedback incorrect";

            if (selected === "") {

                feedback.innerHTML =
                    "⚠️ Please choose an answer. " +
                    "The correct answer is <strong>" +
                    question.answer +
                    "</strong>.";
            }

            else {

                feedback.innerHTML =
                    "✗ Not quite. The correct answer is " +
                    "<strong>" +
                    question.answer +
                    "</strong>. " +
                    question.explanation;
            }
        }

        select.disabled = true;
    });


    setScores[currentSet - 1] = score;

    totalScore = setScores.reduce(
        (sum, value) => sum + (value || 0),
        0
    );

    totalQuestionsAnswered =
        setScores.filter(
            score => score !== undefined
        ).length * 10;

    answersChecked = true;

    document.getElementById("checkButton").style.display =
        "none";


    if (currentSet < 3) {

        document.getElementById("nextButton").style.display =
            "inline-block";
    }

    else {

        document.getElementById("nextButton").style.display =
            "none";
    }

    updateResults();
}


/* =========================================================
   NEXT SET
========================================================= */

function nextSet() {

    if (!answersChecked) {
        return;
    }

    if (currentSet >= 3) {
        return;
    }

    currentSet++;

    startSet();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   RESULTS
========================================================= */

function updateResults() {

    const resultContainer =
        document.getElementById("setResults");

    resultContainer.innerHTML = "";

    for (let i = 0; i < 3; i++) {

        const box =
            document.createElement("div");

        box.className = "set-result";

        const score =
            setScores[i];

        if (score === undefined) {

            box.innerHTML =
                "Set " +
                (i + 1) +
                "<strong>—</strong>";
        }

        else {

            const percentage =
                Math.round((score / 10) * 100);

            box.innerHTML =
                "Set " +
                (i + 1) +
                "<strong>" +
                score +
                "/10</strong>" +
                "<small>" +
                percentage +
                "%</small>";
        }

        resultContainer.appendChild(box);
    }


    const completedSets =
        setScores.filter(
            score => score !== undefined
        ).length;


    if (completedSets === 0) {

        document.getElementById("overallScore")
            .textContent = "0 / 0";

        document.getElementById("resultMessage")
            .textContent =
            "Complete a set to see your results.";

        return;
    }


    const questionsCompleted =
        completedSets * 10;

    const percentage =
        Math.round(
            (totalScore / questionsCompleted) * 100
        );


    document.getElementById("overallScore")
        .textContent =
        totalScore +
        " / " +
        questionsCompleted +
        " (" +
        percentage +
        "%)";


    let message = "";

    if (percentage === 100) {

        message =
            "🌟 Excellent! Perfect score!";
    }

    else if (percentage >= 90) {

        message =
            "🎉 Excellent work! Keep it up!";
    }

    else if (percentage >= 80) {

        message =
            "👏 Great job! You are doing very well!";
    }

    else if (percentage >= 70) {

        message =
            "👍 Good work! Keep practicing!";
    }

    else if (percentage >= 60) {

        message =
            "💪 You are improving. Keep practicing!";
    }

    else {

        message =
            "🌱 Keep practicing. You can do it!";
    }


    document.getElementById("resultMessage")
        .textContent = message;
}


/* =========================================================
   CHANGE LEVEL
========================================================= */

function changeLevel() {

    currentLevel =
        document.getElementById("level").value;

    currentSet = 1;

    setScores = [];

    totalScore = 0;

    totalQuestionsAnswered = 0;

    updateLevelDescription();

    startSet();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   RESTART
========================================================= */

function restartPractice() {

    currentSet = 1;

    setScores = [];

    totalScore = 0;

    totalQuestionsAnswered = 0;

    answersChecked = false;

    updateLevelDescription();

    startSet();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   START APP
========================================================= */

updateLevelDescription();

startSet();

</script>
